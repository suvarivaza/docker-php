services:
  traefik:
    command:
       - "--configFile=/etc/traefik/traefik-dev.yml"
    volumes:
      - "./traefik/config/traefik-dev.yml:/etc/traefik/traefik-dev.yml:ro"

      # Certs for development
      - "./traefik/certs:/certs:ro"
      - "./traefik/config/dev-tls.yml:/etc/traefik/dynamic/dev-tls.yml:ro"

  php:
    build:
      target: development
    ports:
      - '${PHP_PORT:-81}:8080'
    environment:
      # https://serversideup.net/open-source/docker-php/docs/reference/environment-variable-specification
      - PHP_DISPLAY_ERRORS=on
      - DEV_MODE=1

  # Access from the host is only via localhost.
  mysql:
    ports:
      - '127.0.0.1:${DB_PORT:-3306}:3306'

  redis:
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'

  phpmyadmin:
    ports:
      - '${PMA_PORT:-8080}:80'
