services:
  traefik:
    command:
       - "--configFile=/etc/traefik/traefik-dev.yml" # Используем внешний конфигурационный файл Traefik
    volumes:
      # Монтируем config
      - "./traefik/config/traefik-dev.yml:/etc/traefik/traefik-dev.yml:ro"

      # Монтируем самоподписанные сертификаты
      - "./traefik/certs:/certs:ro"
      - "./traefik/config/dev-tls.yml:/etc/traefik/dynamic/dev-tls.yml:ro"

  php:
    build:
      target: development
    ports:
      - '${PHP_PORT:-80}:8080'
    environment:
      # https://serversideup.net/open-source/docker-php/docs/reference/environment-variable-specification
      - PHP_DISPLAY_ERRORS=on
      - DEV_MODE=1

  phpmyadmin:
    ports:
      - '${PMA_PORT:-8080}:80'