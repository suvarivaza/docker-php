# ===============================
#  CUSTOM NGINX OPTIMIZATION
#  (auto-loaded by Serversideup)
# ===============================

##
# 2. Browser caching for static files
##
location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|otf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform";
    access_log off;
    log_not_found off;
}

##
# 3. Security headers
##
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

##
# 4. Deny access to hidden files and Git directories
##
location ~ /\.(?!well-known).* {
    deny all;
}

##
# 5. Optional: block access to backup or source files
##
location ~* \.(?:bak|old|sql|tar|gz|zip|yml|yaml|ini|log|env)$ {
    deny all;
    return 403;
}

##
# 6. Optional: custom error pages (uncomment if needed)
##
#error_page 404 /custom_404.html;
#error_page 500 502 503 504 /custom_50x.html;

##
# 7. Extra fastcgi optimization (for PHP)
##
#fastcgi_connect_timeout 30s;
#fastcgi_send_timeout 60s;
#fastcgi_read_timeout 60s;
#fastcgi_buffer_size 32k;
#fastcgi_buffers 8 32k;
#fastcgi_busy_buffers_size 64k;
#fastcgi_temp_file_write_size 64k;
